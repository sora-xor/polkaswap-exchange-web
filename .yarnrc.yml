approvedGitRepositories: []

compressionLevel: 0

# Preserve the existing lifecycle-script and release-selection behavior on Yarn 4.18.
enableScripts: true
npmMinimalAgeGate: 0

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs

packageExtensions:
  '@reown/appkit@*':
    dependencies:
      '@types/react': 'npm:19.2.2'
  '@typescript-eslint/utils@*':
    dependencies:
      'typescript': 'npm:~5.9.3'
  'cssstyle@*':
    dependencies:
      'postcss': 'npm:^8.5.6'
