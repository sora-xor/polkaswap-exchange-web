        function loadCountrySelect() {
            $('#importPurposeID').dropdown('clear');
            $('#importPurposeID').dropdown('restore defaults');

            $('#product_form_id').dropdown('clear');
            $('#product_form_id').dropdown('restore defaults');

            loadImportPurpose();
        }

        function loadImportPurpose() {
            var options = ""
            var url = serverURL + "importPurpose/importPurposeList";
            var async_status = true;
            controller.getRequest(url, async_status, function (data, status) {
                options += "<option value =''>-Select Import Purpose-</option>";
                options += controller.loadSelect(data, 'importPurposeID', 'name', '');
                $('#importPurposeID').html(options);
            });
        }

        function loadcommoditytypesbyimportpurpose() {
            var countryID = $.trim($("#country_ID").val());
            var importPurposeID = $.trim($("#importPurposeID").val());
            var url5 = serverURL + "importRequirement/findProductByImportRequiremntCountryAndImportPupose?countryId=" + countryID + "&importPurposeId=" + importPurposeID + "";
            var async_status = true;
            controller.getRequest(url5, true, function (data, status) {
                console.log("datadata", data);

                var options = "";
                if (data.length > 0) {
                    options += "<option selected value =''>-Select Commodity-</option>";
                    options += controller.loadSelect(data, 'products_id', 'name', '');
                    $('#products_id').html(options);
                } else {
                    options += "<option>-Select Commodity-</option>";
                    $('#products_id').html(options);
                }
            });
        }

        function loadcommodityformproducts() {

            var countryID = $.trim($("#country_ID").val());
            var importPurposeID = $.trim($("#importPurposeID").val());
            var products_id = $.trim($("#products_id").val());

            var options_22 = "";
            var url5 = serverURL + "importRequirement/findProductFormByImportRequiremntCountry?countryId=" + countryID + "&importPurposeId=" + importPurposeID + "&productId=" + products_id + "";
            var async_status = true;
            controller.getRequest(url5, true, function (data, status) {
                if (data.length > 0) {
                    options_22 += "<option>-Select Commodity Form-</option>";
                    for (let i = 0; i < data.length; i++) {
                        options_22 += '<option value=' + data[i].product_form_id + '>' + data[i].name + '</option>';
                        $('#product_form_id').html(options_22);
                    }
                } else {
                    options_22 += "<option>-Select Commodity-</option>";
                    $('#product_form_id').html(options_22);

                }
            });


        }

            var countryID = $.trim($("#country_ID").val());
