418},{"nameEn":"Prepared Sauces and Preparations For Sauces; Compound Seasoning","nameAr":"صلصات محضرة ومحضرات للصلصات؛ توابل مركبة؛","iconUrl":null,"id":332},{"nameEn":"Ice Cream","nameAr":"(مثلجات (بوظة","iconUrl":null,"id":320},{"nameEn":"Yeasts (Live or Dead)","nameAr":"خمائر (حية أو ميتة)","iconUrl":null,"id":334},{"nameEn":"Abstracts, Spirits and Concentrates","nameAr":"خلاصات وأرواح ومركزات","iconUrl":null,"id":333},{"nameEn":"Protein Concentrates","nameAr":"مركزات البروتيين","iconUrl":null,"id":321},{"nameEn":"Sugared Syrups","nameAr":"سوائل سكرية ","iconUrl":null,"id":322}],"id":5}],"lastestDecisions":[{"nameEn":"Decision No 1/340: The authorization to import some varieties of fruits and vegetables during specific periods ","nameAr":"القرار رقم ٣٤٠\\١: السماح باستيراد بعض أنواع الخضار والفاكهة المستوردة ضمن فترات محددة  ","decisionDate":"2021-09-29T00:00:00","headerId":5,"productId":null,"filePath":"340_20220810141442.pdf","keywords":"","descriptionEn":"\u003cp\u003eThis decision determines the periods during which it is authorized to import some varieties of fruits and vegetables such as onions, grapes, watermelon, melon, pear, banana and olives. \u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eThe import of potatoes is specifically is subject to prior import authorization for the whole year.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eRegarding the import from Egypt, the executive program to support the mutual trade between Lebanon and Egypt shall be observed, provided that the import of potatoes shall be subject to prior authorization during the periods that are determined in the executive program mentioned above.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/New Microsoft Word Document_20221001141733.pdf\" target=\"_blank\"\u003e\u003cstrong\u003eauthorization request\u003c/strong\u003e\u003c/a\u003e \u0026nbsp;to import shall be submitted at the Plant Resources Directorate to the Import and Export Service for advice who shall submit it to the Minister for approval.\u003c/p\u003e\n\n\u003cp\u003eThe request shall include, 1) a copy of the initial invoice indicating the type of the product, weight and packing manner; 2) a copy of the commercial registrar or circular; 3) a copy of the ID of the concerned party.\u003c/p\u003e\n\n\u003cp\u003eIt is authorized to import products mentioned in this decision through the Beirut International Airport for a quantity not exceeding 250 kg without prior authorization and outside the periods specified in this decision.\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/340_20220810141442_20220905131832.pdf\" target=\"_blank\"\u003eTo read the full decision, click on download PDF button below.\u003c/a\u003e\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيحدد هذا القرار فترات السماح لاستيراد بعض الفواكه والخضار مثل البصل، والعنب، والبطيخ، والشمام، والاجاص والموز وحب الزيتون.\u003cbr /\u003e\nيخضع استيراد البطاطا الى اذن استيراد مسبق على مدار العام.\u0026nbsp;\u003cbr /\u003e\nفي ما يتعلق بالاستيراد من مصر، يراعى البرنامج التنفيذي لدعم التبادل التجاري بين لبنان ومصر الموقع بين البلدين، على ان يخضع استيراد البطاطا الى اذن استيراد مسبق ضمن الفترة المحددة في البرنامج التنفيذي المشار اليه أعلاه.\u003cbr /\u003e\nيقدم \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/New Microsoft Word Document_20221001141757.pdf\" target=\"_blank\"\u003e\u003cstrong\u003eطلب الاستيراد المسبق\u003c/strong\u003e\u003c/a\u003e في مديرية الثروة الزراعية الى مصلحة التصدير والاستيراد لإبداء الرأي وترفعه للوزير للموافقة.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\nيجب ان يرفق بالطلب ١) نسخة عن الفاتورة المسبقة، تتضمن نوع وصنف السلعة، الوزن وطريقة التوضيب، ٢) صورة عن السجل التجاري او الإذاعة التجارية، ٣) صورة عن هوية صاحب العلاقة.\u0026nbsp;\u003cbr /\u003e\nيسمح باستيراد السلع الواردة في هذا القرار عبر المطار لكمية ٢٥٠كلغ كحد اقصى دون اذن مسبق خارج الفترات المحددة في هذا القرار.\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/340_20220810141442_20220905131951.pdf\" target=\"_blank\"\u003eللاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","isHidden":false,"product":null,"products":[{"code":"07.01 07.10.10","nameEn":"Potatoes","nameAr":"بطاطا","homeImage":null,"detailsEn":"\u003cp\u003eThis section summarizes the main regulations issued by the Ministry of Agriculture that regulate the farming, production, storage, import, export and sale of Potato in Lebanon.\u003cbr /\u003e\nThese regulations apply to the product under the following Harmonized Systems codes:\u003cbr /\u003e\n07.01\u003cbr /\u003e\n07.10.10\u003c/p\u003e\n","detailsAr":"\u003cp\u003eيهدف هذا الجزء إلى تلخيص القرارات والتوجيهات الصادرة عن وزارة الزراعة والتي تنظم زراعة وإنتاج وتصنيع وتخزين \u0026nbsp;وإستيراد وتصدير وتداول البطاطا \u0026nbsp;في لبنان\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e07.01\u003cbr /\u003e\n07.10.10\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n","order":1,"isHidden":false,"id":51}],"header":{"nameEn":"Import and Export Related Regulations","nameAr":" قرارات على مستوى الإستيراد والتصدير","iconUrl":"import_20211004035237.svg","order":5,"isHidden":false},"id":456},{"nameEn":"Decision No 1/255: Process to grant the certificate of origin for food products of plant origin produced locally and intended for export ","nameAr":"القرار رقم١/٢٥٥ :الية إعطاء إفادة المنشأ للمنتجات الزراعية من أصل نباتي المنتجة محلياً والمعدة للتصدير ","decisionDate":"2021-06-28T00:00:00","headerId":4,"productId":null,"filePath":"قرار 255-1 آلية إعطاء إفادات المنشأ للمنتجات الزراعية المنتجة محليا والمعدة للتصدير من أصل نباتي37092_20220809132617.pdf","keywords":"","descriptionEn":"\u003cp\u003eThis decision details the process to grant the certificate of origin for food products of plant origin.\u003cbr /\u003e\nThe certificate of origin is signed by the president of the concerned Regional Agricultural Service, and in case of his absence by the president of the Plant Resources Department in the said Service, noting that the Mouhafazat of Beirut is linked to the Agricultural Service of Mount Lebanon.\u003cbr /\u003e\nThe certificate is granted pursuant to the request of the exporter or its delegated party \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Attached Form_20220907124702.pdf\" target=\"_blank\"\u003e\u003cstrong\u003eaccording to the attached form\u003c/strong\u003e\u003c/a\u003e. The application is approved if it has the following documents and conditions:\u003cbr /\u003e\n1.\u0026nbsp;\u0026nbsp; \u0026nbsp;The application for the certificate of origin signed by the exporter.\u003cbr /\u003e\n2.\u0026nbsp;\u0026nbsp; \u0026nbsp;The original invoice of the products, issued by the exporter or the related company.\u003cbr /\u003e\n3.\u0026nbsp;\u0026nbsp; \u0026nbsp;A copy of the invoice of the exporter of the products, showing the name of the producer of said products (the farmer or the factory) in case it has the specifications of the Lebanese origin, or the registration number of the producer at the Ministry of Agriculture.\u003cbr /\u003e\n4.\u0026nbsp;\u0026nbsp; \u0026nbsp;A copy of the exporter\u0026rsquo;s ID or a copy of the commercial register of the company.\u003cbr /\u003e\n1.\u0026nbsp;\u0026nbsp; \u0026nbsp;A valid copy of the membership certificate to one of the Chambers of commerce, industry and agriculture.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eThe decision contains a list of plant products according to the coding system agreed with the customs, which may be given a certificate of Lebanese origin by the Ministry of Agriculture.\u003c/p\u003e\n\n\u003cp\u003eThe granting of the certificate of Lebanese origin for a group of products like garlic, grains, and vegetables is done by the competent regional Service after making a field inspection to verify its origin and consequently granting the certificate of origin.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eWith regards to products that do not have a Lebanese origin (in case of re-export or the insufficiency of the operating work to grant it the title of \u0026lsquo;origin\u0026rsquo;), these products are granted a certificate of origin that shows its real origin after submitting the original certificate of origin by the exporter or the related company. \u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/قرار 255-1 آلية إعطاء إفادات المنشأ للمنتجات الزراعية المنتجة محليا والمعدة للتصدير من أصل نباتي37092_20220809132617_20220826145849.pdf\" target=\"_blank\"\u003eTo review the full decision, click on download PDF button below.\u003c/a\u003e\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيشرح هذا القرار آلية إعطاء إفادة المنشأ للمنتجات الزراعية من أصل نباتي.\u003cbr /\u003e\nيوقّع شهادة المنشأ رئيس المصلحة الزراعية الاقليمية المعنية وينوب عنه في حال غيابه رئيس دائرة الثروة الزراعية في المصلحة المذكورة مع الاشارة ان محافظة بيروت تتبع لمصلحة زراعة جبل لبنان.\u003cbr /\u003e\nتعطى الإفادة بناءً على طلب المصدّر أو المفوّض \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Attached Form_20220907124715.pdf\" target=\"_blank\"\u003e\u003cstrong\u003eعنه وفق النموذج المرفق\u003c/strong\u003e\u003c/a\u003e ويقبل الطلب في حال استيفائه المستندات والشروط التالية:\u003cbr /\u003e\n1. طلب إفادة المنشأ موقّع من المصدّر\u003cbr /\u003e\n2. الفاتورة الأصلية الخاصة بالمنتجات صادرة عن المصدر أو الشركة المعنية\u003cbr /\u003e\n3. نسخة عن الفاتورة الخاصة بمصدر السلعة تبين إسم المنتج لهذه السلعة (المزارع أو المصنع) في حال كان لها صفات المنشأ اللبناني أو رقم تسجيل المنتج في وزارة الزراعة.\u003cbr /\u003e\n4. صورة عن هوية المصدّر أو صورة عن السجل التجاري للشركة\u003cbr /\u003e\n5. صورة صالحة عن إفادة الإنتساب إلى إحدى غرف التجارة والصناعة والزراعة\u003cbr /\u003e\nيتضمن القرار لائحة بالمنتجات النباتية بحسب رمز النظام المنسق للجمارك التي تعطى لها إفادة المنشأ اللبناني من قبل وزارة الزراعة.\u003cbr /\u003e\nإن إعطاء إفادة المنشأ اللبناني لمجموعة من السلع مثل الثوم الحبوب، البقوليات يتم من قبل المصلحة الإقليمية المختصة بعد إجراء الكشف الميداني للتحقق من منشئها وبالتالي اعطائها إفادة منشأ\u003cbr /\u003e\n. في ما يخص السلع التي ليس لها صفة المنشأ اللبناني (في حالة إعادة التصدير أو عدم كفاية الأعمال التشغيلية لإعطائها صفة المنشأ) \u0026nbsp;فهي تعطى إفادة منشأ تبين منشأها الأصلي بعد تقديم شهادة المنشأ الأصلية من قبل المصدر أو الشركة المعنية.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\n\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/قرار 255-1 آلية إعطاء إفادات المنشأ للمنتجات الزراعية المنتجة محليا والمعدة للتصدير من أصل نباتي37092_20220809132617_20220826150016.pdf\" target=\"_blank\"\u003eللاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u0026nbsp;\u0026nbsp; \u0026nbsp;\u003c/p\u003e\n","isHidden":false,"product":null,"products":[{"code":"08.13.30","nameEn":"Dried Apples","nameAr":"تفاح مجفف","homeImage":null,"detailsEn":"","detailsAr":"","order":36,"isHidden":false,"id":405},{"code":"22.08.60","nameEn":"Vodka","nameAr":"فودكا","homeImage":null,"detailsEn":"","detailsAr":"","order":13,"isHidden":false,"id":186},{"code":"15.12.19","nameEn":"Cotton-Seed Oil ","nameAr":"زيت بزور القطن","homeImage":null,"detailsEn":"","detailsAr":"","order":11,"isHidden":false,"id":251},{"code":"16.06","nameEn":"Tomato Preparations","nameAr":"محضرات البندورة","homeImage":null,"detailsEn":"","detailsAr":"","order":21,"isHidden":false,"id":330},{"code":"08.02.90.10","nameEn":"Pine Nuts","nameAr":"حب الصنوبر","homeImage":null,"detailsEn":"","detailsAr":"","order":27,"isHidden":false,"id":275},{"code":"17.01","nameEn":"Cane or Beet Sugar","nameAr":"قصب السكر","homeImage":null,"detailsEn":"","detailsAr":"","order":4 d","nameAr":"حبوب العصافير","homeImage":null,"detailsEn":"","detailsAr":"","order":10,"isHidden":false,"id":136},{"code":"10.02","nameEn":"Rye","nameAr":"شيلم أو جاودار","homeImage":null,"detailsEn":"","detailsAr":"","order":2,"isHidden":false,"id":137},{"code":"08.07.11","nameEn":"Watermelons","nameAr":"بطيخ أحمر","homeImage":null,"detailsEn":"","detailsAr":"","order":14,"isHidden":false,"id":141},{"code":"09.01.21 09.01.22 09.01.90","nameEn":"Roasted Coffee","nameAr":"بن ","homeImage":null,"detailsEn":"\u003cp\u003eThis section summarizes the main regulations issued by the Ministry of Agriculture that regulates the import, export and the conditions of processing, storing and packaging coffee in Lebanon (including roasted coffee).\u003c/p\u003e\n","detailsAr":"\u003cp\u003eيهدف هذا الجزء الى تلخيص القرارات الصادرة عن وزارة الزراعة والتي تنظم استيراد وتصدير وتصنيع وتخزين ووتغليف ونقل حبوب البن الاخضر او االمحمص.\u003c/p\u003e\n","order":1,"isHidden":false,"id":40}],"header":{"nameEn":"Certificates and Attestations Related Regulations","nameAr":"قرارات خاصة بالشهادات والإفادات","iconUrl":"export_20211004035227.svg","order":4,"isHidden":false},"id":469}],"keyLegislations":[{"nameEn":"Law No 224: Technical regulations and the related conformity procedures ","nameAr":"قانون رقم ٢٢٤: القواعد الفنية وإجراءات تقييم المطابقة الخاصة بها ","decisionDate":"2012-10-22T00:00:00","decisionDateEN":null,"decisionDateAR":null,"headerId":null,"productId":null,"parentDecisionId":null,"filePath":"Law 224_20220819114607.pdf","keywords":"","descriptionEn":"\u003cp\u003eThis law determines the procedures to adopt for the technical regulations and the assessment of the conformity of products or services to these regulations, and the obligations of the professionals that display products and offers services in the Lebanese market.\u003c/p\u003e\n\n\u003cp\u003eThis law determines the general rules for the display of products and the offering of services in the Lebanese market. It further determines the conditions that should be available upon the display of products and the offering of services, such as their submission to the conformity procedures and technical regulations, and their need not to endanger the national security or the health of humans, animals, plants, properties and environment.\u003c/p\u003e\n\n\u003cp\u003eTechnical regulations, their adoption procedures and their effects are also governed by this law. It further determines the role of the Lebanese Standards Institution \u0026ldquo;LIBNOR\u0026rdquo; in the preparation of the technical regulation project and the mechanism to be followed for its issuance, since the technical regulation aims at the protection of public interest and considers the rules of international trade.\u003c/p\u003e\n\n\u003cp\u003eThis law determines the obligations of the professional, ranging from the producer and its representative to the importer and the distributor.\u003cbr /\u003e\nThe issuance of conformity certificates is included, in addition to technical documents and the manner to issue the conformity badge related to the technical regulation, and the acknowledgement of the conformity documents and badges issued abroad.\u003cbr /\u003e\nThis law determines the penalties and fines due upon the violation of the provisions of this law.\u0026nbsp;\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Law 224_20220819114607_20220922150209.pdf\" target=\"_blank\"\u003eTo read the full Law, click on download PDF button below.\u003c/a\u003e\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيرمي هذا القانون الى تحديد إجراءات اعتماد القواعد الفنية وتقييم مطابقة المنتج او الخدمة لهذه القواعد وموجبات المحترف الذي يضع منتجات او يقدم خدمات في الأسواق اللبنانية.\u0026nbsp;\u003cbr /\u003e\nيحدد هذا القانون الاحكام العامة لعرض منتج او تقديم خدمة في الأسواق. ويحدد الشروط التي يجب ان تتوفر عند عرض المنتج او تقديم الخدمة مثل خضوعها لإجراءات تقييم المطابقة والقواعد الفنية وعدم اضرارها بالأمن الوطني او صحة وسلامة الانسان، الحيوان، والنباتات والممتلكات والبيئة.\u003c/p\u003e\n\n\u003cp\u003eكما يحدد هذا القانون القواعد الفنية وإجراءات اعتمادها ومفاعيلها، ويحدد دور مؤسسة المقاييس والمواصفات اللبنانية \u0026quot;ليبنور\u0026quot; لاعداد مشروع القاعدة الفنية والآلية المتبعة لصدورها كون القاعدة الفنية تهدف الى حماية المصالح العامة وتراعي احكام التجارة الدولية.\u003c/p\u003e\n\n\u003cp\u003eكما حدد هذا القانون موجبات المحترف من المصنع، والممثل المفوض والمستورد الى الموزع.\u003cbr /\u003e\nكما تضمن اصدار إفادات المطابقة والوثائق الفنية وكيفية منح شارة المطابقة الخاصة بالقاعدة الفنية، والاعتراف بوثائق تقييم المطابقة وشارات المطابقة الصادرة في الخارج.\u003cbr /\u003e\nحدد هذا القانون العقوبات والغرامات المترتبة عن مخالفة احكام هذا القانون. \u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Law 224_20220819114607_20220922145953.pdf\" target=\"_blank\"\u003eللإطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","isHidden":false,"keyLegislation":true,"order":1,"product":null,"products":[],"decisionsProducts":[],"header":null,"id":8},{"nameEn":"Law No 35: Food Safety Law ","nameAr":"قانون رقم ٣٥: قانون سلامة الغذاء ","decisionDate":"2015-11-24T00:00:00","decisionDateEN":null,"decisionDateAR":null,"headerId":1,"productId":null,"parentDecisionId":null,"filePath":"Food Safety Law N.35_20220819114417.pdf","keywords":"","descriptionEn":"\u003cp\u003eThis law shall be applicable to all kind of food products, drinks and all materials that are used in food production, its transformation, preparation, packaging, treatment and marketing, and on all agricultural products including those which enter in the preparation of food or its manufacturing even if they are not considered food by themselves.\u0026nbsp;\u003cbr /\u003e\nThis law includes the rules that governs food safety and its conformity with the adopted specifications, mainly the international specifications and standards determined by the \u0026ldquo;Codex Aliment Arius\u0026rdquo;, and its safety for human consumption, ensuring it does not harm human health, or animals or the environment.\u003c/p\u003e\n\n\u003cp\u003eThe law further determines the obligations of professionals and food enterprises that deal with food production, in addition to the obligations of farmers. The law also mentiones the transportation operations, display and traceability of food.\u003c/p\u003e\n\n\u003cp\u003eThe law has established the Food Safety Lebanese Commission, determined its formation mechanism, its members, resources, its mission, its operations, its crisis management and inspection operations.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Food Safety Law N.35_20220819114333.pdf\" target=\"_blank\"\u003eTo read the full Law, click on download PDF button below.\u003c/a\u003e\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيطبق هذا القانون على جميع أنواع المأكولات والمشروبات وجميع المواد التي تستعمل لتصنيع الغذاء وتحويله وتحضيره وتعبئته ومعالجته وتسويقه، وعلى جميع المنتجات الزراعية بما في ذلك تلك التي تدخل في اعداد الغذاء او صناعته وان كانت لا تعتبر غذاء بذاتها.\u003cbr /\u003e\nيشمل هذا القانون القواعد التي ترعى سلامة الغذاء ومطابقته للمواصفات المعتمدة لا سيما المواصفات الدولية المحددة من قبل هيئة الدستور الغذائي وسلامته للاستهلاك البشري وكونه لا يلحق ضرر بصحة الانسان او الحيوانات او البيئة.\u003cbr /\u003e\nكما حدد هذا القانون موجبات المحترف والمؤسسة الذين يتعاطون في انتاج وصناعة الغذاء، كما وموجبات المزارع. كما تطرق الى عمليات نقل وعرض وتتبع الغذاء.\u003cbr /\u003e\nكما انشأ هذا القانون الهيئة اللبنانية لسلامة الغذاء، وحدد كيفية تشكيلاها واعضائها ومواردها وحدد مهامها واعمالها وادارتها للازمات واعمالها الرقابية.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\n\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Food Safety Law N.35_20220819114411.pdf\" target=\"_blank\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","isHidden":false,"keyLegislation":true,"order":2,"product":null,"products":[],"decisionsProducts":[],"header":{"nameEn":"Farm-Related Regulations  ","nameAr":"  قرارات على مستوى المزرعة","iconUrl":"fruit-bow_20211007045216.svg","order":1,"isHidden":true,"decisions":null,"id":1},"id":7},{"nameEn":"Law No 778: Agricultural Quarantine and plant health measures ","nameAr":"قانون رقم ٧٧٨: الحجر النباتي وتدابير الصحة النباتية ","decisionDate":"2006-11-28T00:00:00","decisionDateEN":null,"decisionDateAR":null,"headerId":null,"productId":null,"parentDecisionId":null,"filePath":"Law 778_20220819115205.pdf","keywords":"","descriptionEn":"\u003cp\u003eThe objective of this law is to prohibit the entry of agricultural pests and their propagation, the facilitation of trade and the protection of the environment and plant resources.\u003c/p\u003e\n\n\u003cp\u003eThis law has determined the procedures and measures of the agricultural quarantine on all kinds of plants as well as exported or imported plant products and has fixed the procedures that should be followed.\u003c/p\u003e\n\n\u003cp\u003eThis law has granted the Ministry of Agriculture the prerogatives to undertake the health and plant health measures, the control, inspection and tests, in order to ensure the protection from the entry of pests, diseases, micro organisms containing diseases, and the protection from additions or pollutants or poisons and others.\u003c/p\u003e\n\n\u003cp\u003eThis law has further determined the role of the ministry in issuing health certificates for products intended for export or import, in addition to the prerogatives in issuing instructions for the organization of the process of agricultural quarantine, the supervision of the sterilization and sanitation operations, cleaning and others.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eThis law has also determined the obligations of the importer upon the arrival of shipments that are subject to agricultural quarantine and the required documents.\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Law 778_20220819115124.pdf\" target=\"_blank\"\u003eTo read the full decision, click on download PDF button below\u003c/a\u003e.\u003c/p\u003e\n","descriptionAr":"\u003cp\u003e\u003cspan dir=\"RTL\"\u003eيهدف هذا القانون الى منع دخول الآفات الزراعية وانتشارها، وتسهيل التجارة وحماية البيئة والموارد النباتية.\u003cbr /\u003e\nحدد هذا القانون إجراءات وتدابير الحجر النباتي على كافة أنواع النباتات والمنتجات النباتية مصدرة او مستوردة، وحدد الأسس التي يجب الاستناد لها.\u003c/span\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cspan dir=\"RTL\"\u003eكما اعطى وزارة الزراعة صلاحيات اتخاذ التدابير الصحية والصحة النباتية والرقابة والمعاينة والفحوصات من اجل تحقيق عدة أهداف منها الحماية من مخاطر دخول الآفات والامراض او الكائنات العضوية الحاملة للأمراض، والحماية من الإضافات او الملوثات او السموم وغيرها.\u003c/span\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cspan dir=\"RTL\"\u003eكما حدد شروط وصلاحيات الوزارة في اصدار الشهادات الصحية للمنتجات المراد تصديرها او استيرادها، كما وصلاحيات اصدار التعليمات لتنظيم إجراءات الحجر النباتي، والاشراف على اعمال التعقيم والتطهير والتنظيف وغيرها.\u003c/span\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cspan dir=\"RTL\"\u003eحدد هذا القانون موجبات المستورد عند وصول ارساليات تخضع للحجر النباتي والمستندات اللازمة.\u003c/span\u003e\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Law 778_20220819115156.pdf\" target=\"_blank\"\u003e\u003cspan dir=\"RTL\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n","isHidden":false,"keyLegislation":true,"order":3,"product":null,"products":[],"decisionsProducts":[],"header":null,"id":476},{"nameEn":"Decree No 12301: Veterinary Quarantine ","nameAr":"مرسوم رقم ١٢٣٠١: الحجر الصحي البيطري","decisionDate":"1963-03-20T00:00:00","decisionDateEN":null,"decisionDateAR":null,"headerId":null,"productId":null,"parentDecisionId":null,"filePath":"veterinary quarantine animal products مرسوم 12301 الحجر الصحي البيطري_20220830085655_20220914143840.pdf","keywords":"","descriptionEn":"\u003cp\u003eThis decree shall apply to the veterinary quarantine, which consists in subjecting animals and animal based products exported to Lebanon to the veterinary health control in order to prevent the infiltration of pandemic deceases to Lebanon.\u003cbr /\u003e\nAll animals, domesticated and non-domesticated birds shall be subject to the provisions of this law, in addition to animal derivatives such as meat, milk and its derivatives, eggs, leather and others.\u003c/p\u003e\n\n\u003cp\u003eThis law governs the conditions of entry of animals such as their possession of a veterinary health certificate from the country of origin and other conditions in case such certificate is not available.\u003c/p\u003e\n\n\u003cp\u003eThe management of quarantine premises and persons in charge are also determined by this decree, in addition to the manner in which animals are entered, from which border they enter, the mechanism of their stamp and quarantine duration. It also determines the import procedures for certain types of animals coming from endemic countries, and the procedures that should be taken in case diseases appeared during quarantine. The animal owners\u0026rsquo; obligations are also governed.\u003cbr /\u003e\nThis decree also governs the inspection of violations and the prerogatives of the relevant employees, and determines the penalties and fines to be applied upon violation. \u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/veterinary quarantine animal products مرسوم 12301 الحجر الصحي البيطري_20220830085655_20220914143840_20220922154736.pdf\" target=\"_blank\"\u003eTo read the full Law, click on download PDF button below.\u003c/a\u003e\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيطبق هذا القانون على الحجر الصحي البيطري الذي هو عملية اخضاع الحيوانات والمواد الحيوانية المستوردة الى لبنان للمراقبة الصحية البيطرية لمنع تسرب الامراض الوبائية الى لبنان.\u003cbr /\u003e\nتخضع جميع الحيوانات والطيور الداجنة وغير الداجنة الى احكام هذا القانون كما والمشتقات الحيوانية من اللحوم والحليب ومشتقاته والبيض والجلود وغيرها.\u0026nbsp;\u003cbr /\u003e\nيرعى هذا القانون شروط دخول الحيوانات مثل حيازتها على شهادة صحية بيطرية من بلد المنشأ وغيرها من الشروط في حال عدم وجودها.\u003c/p\u003e\n\n\u003cp\u003eيحدد القانون طريقة إدارة المحاجر والمسؤولين فيهم، كما وطريقة وكيفية دخول الحيوانات ومن اية معابر حدودية وآلية ختمها ومدة حجرها. كما يحدد إجراءات الاستيراد لأنواع من الحيوانات من البلدان الموبوءة، والإجراءات المتخذة في حال ظهور الامراض خلال الحجر. كما يحدد واجبات أصحاب الحيوانات.\u003cbr /\u003e\nيحدد هذا القانون معاينة المخالفات وصلاحية الموظفين المولجين بها ويحدد العقوبات والغرامات عند المخالفة.\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/veterinary quarantine animal products مرسوم 12301 الحجر الصحي البيطري_20220830085655_20220914143840_20220922154714.pdf\" target=\"_blank\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","isHidden":false,"keyLegislation":true,"order":4,"product":null,"products":[],"decisionsProducts":[],"header":null,"id":523}],"statistics":{"prodcutsCount":277,"decisionsCount":128,"searchLogsCount":27846,"usersCount":99400},"subjects":[{"arabicName":"سؤال عام","englishName":"General Question","email":"mimo_eid@hotmail.com","id":1},{"arabicName":"منتجات من منشأ حيواني","englishName":"Products from animal origin","email":"mimo_eid@hotmail.com","id":2},{"arabicName":"منتجات نباتية","englishName":"Plant products","email":"mimo_eid@hotmail.com","id":3},{"arabicName":"منتجات الصناعات الزراعية","englishName":"Processed foods","email":"mimo_eid@hotmail.com","id":4},{"arabicName":"منتجات حرجية","englishName":"Forestry","email":"randaserhal@gmail.com","id":5}]}},"__N_SSP":true},"page":"/","query":{},"buildId":"7xqFgacYQDCh_XAQMgQzy","isFallback":false,"gssp":true,"customServer":true,"locale":"ar","locales":["ar","en"],"defaultLocale":"ar","scriptLoader":[]}</script></body></html>
