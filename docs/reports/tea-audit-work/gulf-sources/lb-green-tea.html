"يقدم هذا الجزء ملخصاً للقرارات الصادرة عن وزارة الزراعة والتي تنظم إصدار الشهادات والإفادات اللازمة للتجارة والتصدير. ملخص القرارات خاص بمنتجكم ويتضمن النماذج التي يجب ملؤها وتقديمها إلى الوزارة للحصول على الموافقات المطلوبة.","descriptionEn":"This section summarizes key decisions issued by the Ministry of Agriculture that regulate the issuance of certificates and attestations which are needed for trading and exporting. The summary of decisions is specific for your product and includes the templates that need to be filled and submitted to the ministry to get the needed approvals.","headerId":4,"id":364},{"descriptionAr":"يتضمن هذا الجزء أهم القرارات التي تنظم استيراد وتصدير الشاي أخضر.","descriptionEn":"This section includes important import and export-related regulations related to Green Tea.","headerId":5,"id":365},{"descriptionAr":"يشمل هذا الجزء القرارات الأخرى الصادرة عن وزارة الزراعة والمتعلقة بمنتج الشاي أخضر في لبنان.","descriptionEn":"This section includes a summary of other decisions issued by the Ministry of Agriculture related to Green Tea.","headerId":6,"id":366}],"productDecisions":[{"nameEn":"Decision 1/950: Registration of agri-food factories and technical inspection on them","nameAr":"القرار رقم 1/٩٥٠:  تسجيل مصانع إنتاج الغذاء والرقابة الفنية عليها","decisionDate":"2011-10-26T00:00:00","filePath":"قرار-تسجيل-مصانع-انتاج-الغذاء-والرقابة-الفنية-عليها-2_20211016115321_20220915123838_20220916115537.pdf","descriptionEn":"\u003cp\u003eThis ministerial decision explains the procedures for registering any agri-food processing factory in Lebanon with the Ministry of Agriculture and how the technical inspection from the ministry is conducted.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\nDocuments needed for registration of the factory at the Ministry of Agriculture:\u003c/p\u003e\n\n\u003cp\u003e1.\u0026nbsp;\u0026nbsp; \u0026nbsp;\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/طلب-تسجيل-مصنع-غذاء_20220916120956.pdf\" target=\"_blank\"\u003eApplication form\u003c/a\u003e to be submitted to the regional Agriculture office where the plant is located. For coops that want to register their facility for agro-processing, this is the \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/طلب-تسجيل-تعاونية-تصنيع-غذايي_20220916121013.pdf\" target=\"_blank\"\u003eapplication form\u003c/a\u003e.\u003cbr /\u003e\n2.\u0026nbsp;\u0026nbsp; \u0026nbsp;Copy of the license from the Ministry of Industry\u003cbr /\u003e\n3.\u0026nbsp;\u0026nbsp; \u0026nbsp;Copy of Industrial certificate issued from the Ministry of Industry\u003cbr /\u003e\n4.\u0026nbsp;\u0026nbsp; \u0026nbsp;Copy of membership at one of the chambers (for factories that want to export)\u003cbr /\u003e\n5.\u0026nbsp;\u0026nbsp; \u0026nbsp;The decision to establish a COOP (applicable only to COOPs that produce agri-food products)\u003c/p\u003e\n\n\u003cp\u003eCompanies can request attestation for registration of their facility by filling an \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/نموذج-طلب-افادة-تسجيل-في-وزارة-الزراعة_20220916121056.pdf\" target=\"_blank\"\u003eapplication form \u003c/a\u003eand can request the \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/نموذج-طلب-تجديد-افادة-التسجيل-في-وزارة-الزراعة_20220916121132.pdf\" target=\"_blank\"\u003erenewal of this application from\u003c/a\u003e the directorate of agri-food industries.\u003c/p\u003e\n\n\u003cp\u003eAfter submitting an application, a team from the Ministry of Industry and Ministry of Agriculture inspects the factory based on an \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/استمارة-التفتيش-على-مصنع-غذاء-من-منشا-نباتي_20220916121234.pdf\" target=\"_blank\"\u003einspection sheet\u003c/a\u003e and makes sure it is abiding with the Good Manufacturing Practices (GMP) and LIBNOR standards 656 for general rules related to food safety and the guidelines for the application of the HACCP system (LIBNOR standard 605) as well as the LIBNOR standards related to frozen food (LIBNOR standard 654).\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eBased on the inspection results, the factory is provided a health number from the Ministry of Agriculture in case it is abiding by all the mandatory requirements.\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/قرار-تسجيل-مصانع-انتاج-الغذاء-والرقابة-الفنية-عليها-2_20211016115321_20220915123814.pdf\" target=\"_blank\"\u003eTo read the full decision, click on download PDF button below.\u003c/a\u003e\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eالسوق المحلية او للتصدير ان يسجل مصنعه في وزارة الزراعة مصلحة الصناعات الزراعية.\u003c/p\u003e\n\n\u003cp\u003eيتم التسجيل من خلال \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/طلب-تسجيل-مصنع-غذاء_20220916121409.pdf\" target=\"_blank\"\u003eملء طلب (نموذج مرفق)\u003c/a\u003e وتقديمه في مصلحة الزراعة الإقليمية المعنية (يمكن ارفاق لائحة بالموظفين المسؤولين مع رقم الهاتف)\u003cbr /\u003e\nللتعاونيات التي تريد تسجيل مصنعها الغذائي، يجب تعبئة \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/طلب-تسجيل-تعاونية-تصنيع-غذايي_20220916121448.pdf\" target=\"_blank\"\u003eالإستمارة المرفقة\u003c/a\u003e\u003cbr /\u003e\nيجب ارفاق طلب التسجيل بالمستندات التالية (اذا وجدت):\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026bull;\u0026nbsp;\u0026nbsp; \u0026nbsp;ترخيص من وزارة الصناعة\u003cbr /\u003e\n\u0026bull;\u0026nbsp;\u0026nbsp; \u0026nbsp;شهادة صناعية من وزارة الصناعة\u003cbr /\u003e\n\u0026bull;\u0026nbsp;\u0026nbsp; \u0026nbsp;شهادة انتساب الى غرفة التجارة والصناعة والزراعة\u0026nbsp;\u003cbr /\u003e\n\u0026bull;\u0026nbsp;\u0026nbsp; \u0026nbsp;قرار انشاء جمعية تعاونية\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\nيتم الحصول على الإفادة المذكورة أعلاه بعد التقدم بطلب \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/نموذج-طلب-تجديد-افادة-التسجيل-في-وزارة-الزراعة_20220916121535.pdf\" target=\"_blank\"\u003eالحصول على /تجديد الإفادة\u003c/a\u003e في مصلحة الصناعات الزراعية .يمكن التواصل بواسطة البريد الالكتروني.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\nبعد تقديم الطلب يتم الكشف على المصنع من قبل فريق عمل مشترك من قبل وزارة الصناعة ووزارة الزراعة بالاستناد الى استمارة تفتيش، ويتأكدوا بالالتزام المصنع بممارسات التصنيع الجيدة (GMP) ووفقا للمعاير والأنظمة اللبنانية النافذة مثل الموصفات القياسية رقم ٦٥٦ \u0026quot;القواعد العامة لصحة الغذاء\u0026quot; يالاضافة الى أنظمة تحليل المخاطر ونقاط المراقبة الحرجة (HACCP) وفق الموصفة القياسية اللبنانية رقم ٦٠٥، يالاضافة الى المواصفة القياسية اللبنانية رقم ٦٥٤ المتعلقة بالاغذية المجمدة.\u0026nbsp;\u003cbr /\u003e\nتعطى \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/نموذج-طلب-افادة-تسجيل-في-وزارة-الزراعة_20220916121650.pdf\" target=\"_blank\"\u003eالإفادة\u003c/a\u003e الى المصانع التي تستوفي متطلبات سلامة الغذاء وتتجاوب مع تعليمات فريق الكشف الذي يقوم بزيارات دورية الى المصنع ويسجل حالات عدم المطابقة من خلال جدول كشف \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/استمارة-التفتيش-على-مصنع-غذاء-من-منشا-نباتي_20220916121740.pdf\" target=\"_blank\"\u003e(نموذج مرفق)\u003c/a\u003e ويرفع تقريره الى مصلحة الصناعات الزراعية لاجراء المناسب : منح الإفادة، او \u0026nbsp;إعطاء انذار كمهلة لتحقيق المطلوب، او إعطاء انذار مع وقف الإنتاج.\u0026nbsp;\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/قرار-تسجيل-مصانع-انتاج-الغذاء-والرقابة-الفنية-عليها-2_20211016115321_20220915123838.pdf\" target=\"_blank\"\u003eللاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u0026nbsp;\u003c/a\u003e\u003c/p\u003e\n","keyLegislation":false,"headerId":3,"relatedDecisions":[],"id":376},{"nameEn":"Decision No 1/272: Process for issuing the health certificate for processed or transformed food products from plant origin ","nameAr":"القرار رقم ٢٧٢/١:آلية إصدار شهادات صحية للمواد الغذائية المصنعة أو المحولة من أصل نباتي ","decisionDate":"2019-06-08T00:00:00","filePath":"شهادة صحية عند التصدير2305843009247457322_20220809133430.pdf","descriptionEn":"\u003cp\u003eThis decision details the requirements needed to obtain the health certificate issued by the Ministry of Agriculture in order to facilitate the export of processed or transformed food products from plant origin, and in order not to be rejected by the importing countries.\u003c/p\u003e\n\n\u003cp\u003eThe certificate is granted \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/شهادة صحية عند التصدير_20220907122653.pdf\" target=\"_blank\"\u003e\u003cstrong\u003ein the form attached\u003c/strong\u003e\u003c/a\u003e pursuant to the request of the concerned party for the products of plant origin, and is mandatory for all products of animal origin.\u003cbr /\u003e\nThe application is accompanied with the lab results issued by the officially approved laboratories, which prove the validity of the exported products for human consumption.\u0026nbsp;\u003cbr /\u003e\nThe lab test shall include the following analyses, according to the request of the importing country:\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp; Microbial analyses\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;Radiological analyses\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;Chemical deposits analyses\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;others\u003cbr /\u003e\nThe lab test shall remain valid for the products that have been produced in one batch for several exported shipments and that carry the same batch number, within a period of three months from said test\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/شهادة صحية عند التصدير2305843009247457322_20220809133430_20220826145531.pdf\" target=\"_blank\"\u003eTo read the full decision, click on download PDF button below.\u003c/a\u003e\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيشرح هذا القرار كيفية الحصول على شهادة صحية صادرة من وزارة الزراعة لتسهيل تصدير المواد الغذائية المصنعة أو المحولة من أصل نباتي وعدم رفضها من البلدان المستوردة.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\nتعطى هذه الشهادة بناء على طلب \u0026nbsp;\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/شهادة صحية عند التصدير_20220907122716.pdf\" target=\"_blank\"\u003e\u003cstrong\u003eنموذج مرفق\u003c/strong\u003e\u003c/a\u003e صاحب العلاقة للمنتجات من منشأ نباتي وهي الزامية للمنتجات من منشأ حيواني.\u003c/p\u003e\n\n\u003cp\u003eيرفق الطلب بتحليل مخبري صادر عن احد المختبرات المعترف بها رسمياً يثبت صلاحية المواد المصدرة للإستهلاك البشري.\u003cbr /\u003e\nيشمل التحليل المخبري التحاليل التالية حسب طلب البلد المستورد:\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;تحاليل جرثومية\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;تحاليل إشعاعية\u0026nbsp;\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;تحاليل ترسبات كيميائية\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;غيرها\u003c/p\u003e\n\n\u003cp\u003eيبقى التحليل المخبري صالحاً للمواد التي تم تصنيعها دفعة واحدة وتحمل نفس رقم الدفعة (batch number) لعدة ارساليات مصدرة متتالية ضمن ثلاثة أشهر من اجرائه.\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/شهادة صحية عند التصدير2305843009247457322_20220809133430_20220826145644.pdf\" target=\"_blank\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","keyLegislation":false,"headerId":4,"relatedDecisions":[],"id":468},{"nameEn":"Decision No 1/255: Process to grant the certificate of origin for food products of plant origin produced locally and intended for export ","nameAr":"القرار رقم١/٢٥٥ :الية إعطاء إفادة المنشأ للمنتجات الزراعية من أصل نباتي المنتجة محلياً والمعدة للتصدير ","decisionDate":"2021-06-28T00:00:00","filePath":"قرار 255-1 آلية إعطاء إفادات المنشأ للمنتجات الزراعية المنتجة محليا والمعدة للتصدير من أصل نباتي37092_20220809132617.pdf","descriptionEn":"\u003cp\u003eThis decision details the process to grant the certificate of origin for food products of plant origin.\u003cbr /\u003e\nThe certificate of origin is signed by the president of the concerned Regional Agricultural Service, and in case of his absence by the president of the Plant Resources Department in the said Service, noting that the Mouhafazat of Beirut is linked to the Agricultural Service of Mount Lebanon.\u003cbr /\u003e\nThe certificate is granted pursuant to the request of the exporter or its delegated party \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Attached Form_20220907124702.pdf\" target=\"_blank\"\u003e\u003cstrong\u003eaccording to the attached form\u003c/strong\u003e\u003c/a\u003e. The application is approved if it has the following documents and conditions:\u003cbr /\u003e\n1.\u0026nbsp;\u0026nbsp; \u0026nbsp;The application for the certificate of origin signed by the exporter.\u003cbr /\u003e\n2.\u0026nbsp;\u0026nbsp; \u0026nbsp;The original invoice of the products, issued by the exporter or the related company.\u003cbr /\u003e\n3.\u0026nbsp;\u0026nbsp; \u0026nbsp;A copy of the invoice of the exporter of the products, showing the name of the producer of said products (the farmer or the factory) in case it has the specifications of the Lebanese origin, or the registration number of the producer at the Ministry of Agriculture.\u003cbr /\u003e\n4.\u0026nbsp;\u0026nbsp; \u0026nbsp;A copy of the exporter\u0026rsquo;s ID or a copy of the commercial register of the company.\u003cbr /\u003e\n1.\u0026nbsp;\u0026nbsp; \u0026nbsp;A valid copy of the membership certificate to one of the Chambers of commerce, industry and agriculture.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eThe decision contains a list of plant products according to the coding system agreed with the customs, which may be given a certificate of Lebanese origin by the Ministry of Agriculture.\u003c/p\u003e\n\n\u003cp\u003eThe granting of the certificate of Lebanese origin for a group of products like garlic, grains, and vegetables is done by the competent regional Service after making a field inspection to verify its origin and consequently granting the certificate of origin.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eWith regards to products that do not have a Lebanese origin (in case of re-export or the insufficiency of the operating work to grant it the title of \u0026lsquo;origin\u0026rsquo;), these products are granted a certificate of origin that shows its real origin after submitting the original certificate of origin by the exporter or the related company. \u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/قرار 255-1 آلية إعطاء إفادات المنشأ للمنتجات الزراعية المنتجة محليا والمعدة للتصدير من أصل نباتي37092_20220809132617_20220826145849.pdf\" target=\"_blank\"\u003eTo review the full decision, click on download PDF button below.\u003c/a\u003e\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيشرح هذا القرار آلية إعطاء إفادة المنشأ للمنتجات الزراعية من أصل نباتي.\u003cbr /\u003e\nيوقّع شهادة المنشأ رئيس المصلحة الزراعية الاقليمية المعنية وينوب عنه في حال غيابه رئيس دائرة الثروة الزراعية في المصلحة المذكورة مع الاشارة ان محافظة بيروت تتبع لمصلحة زراعة جبل لبنان.\u003cbr /\u003e\nتعطى الإفادة بناءً على طلب المصدّر أو المفوّض \u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/Attached Form_20220907124715.pdf\" target=\"_blank\"\u003e\u003cstrong\u003eعنه وفق النموذج المرفق\u003c/strong\u003e\u003c/a\u003e ويقبل الطلب في حال استيفائه المستندات والشروط التالية:\u003cbr /\u003e\n1. طلب إفادة المنشأ موقّع من المصدّر\u003cbr /\u003e\n2. الفاتورة الأصلية الخاصة بالمنتجات صادرة عن المصدر أو الشركة المعنية\u003cbr /\u003e\n3. نسخة عن الفاتورة الخاصة بمصدر السلعة تبين إسم المنتج لهذه السلعة (المزارع أو المصنع) في حال كان لها صفات المنشأ اللبناني أو رقم تسجيل المنتج في وزارة الزراعة.\u003cbr /\u003e\n4. صورة عن هوية المصدّر أو صورة عن السجل التجاري للشركة\u003cbr /\u003e\n5. صورة صالحة عن إفادة الإنتساب إلى إحدى غرف التجارة والصناعة والزراعة\u003cbr /\u003e\nيتضمن القرار لائحة بالمنتجات النباتية بحسب رمز النظام المنسق للجمارك التي تعطى لها إفادة المنشأ اللبناني من قبل وزارة الزراعة.\u003cbr /\u003e\nإن إعطاء إفادة المنشأ اللبناني لمجموعة من السلع مثل الثوم الحبوب، البقوليات يتم من قبل المصلحة الإقليمية المختصة بعد إجراء الكشف الميداني للتحقق من منشئها وبالتالي اعطائها إفادة منشأ\u003cbr /\u003e\n. في ما يخص السلع التي ليس لها صفة المنشأ اللبناني (في حالة إعادة التصدير أو عدم كفاية الأعمال التشغيلية لإعطائها صفة المنشأ) \u0026nbsp;فهي تعطى إفادة منشأ تبين منشأها الأصلي بعد تقديم شهادة المنشأ الأصلية من قبل المصدر أو الشركة المعنية.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\n\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/قرار 255-1 آلية إعطاء إفادات المنشأ للمنتجات الزراعية المنتجة محليا والمعدة للتصدير من أصل نباتي37092_20220809132617_20220826150016.pdf\" target=\"_blank\"\u003eللاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u0026nbsp;\u0026nbsp; \u0026nbsp;\u003c/p\u003e\n","keyLegislation":false,"headerId":4,"relatedDecisions":[],"id":469},{"nameEn":"Decision No 633/1: Labelling and Nutritional Fact Table for imported food products of plant-origin (12/07/2012) as amended by virtue of Decision No 772/1","nameAr":"القرار رقم 1/633 : فرض وجود سمة التعريف (بطاقة المعلومات البيانية) على المنتجات الغذائية المستوردة من اصل نباتي (١٢\\٧\\٢٠١٢) والمعدل بموجب القرار رقم 1/772","decisionDate":"2012-07-12T00:00:00","filePath":"772-تعديل-قرار-633-سمة-التعريف-على-المنتجات-الغذايية_20220809132734.pdf","descriptionEn":"\u003cp\u003e\u003cins\u003eThe containers of non-fresh imported food products\u003c/ins\u003e of plant origin have to be labelled with a nutritional fact table which shall adopt special national rules and procedures, and to abide by the writing of the information and necessary data in a clear and un-erasable inscription, which shall include the list of information determined by the decision, such as the general name of the product, address of the factory, country of origin, physical status of the product, list of ingredients, net weight and volume prior to packing, barcode enabling the identification of the factory and the production batch, production and expiry date and others.\u003c/p\u003e\n\n\u003cp\u003e\u003cins\u003eThe containers of fresh imported food products\u003c/ins\u003e of plant origin have to be labelled with a nutritional fact table which shall adopt special national rules and procedures, and to abide by the writing of the information and necessary data in a clear and un-erasable inscription, which shall include the list of information determined by the decision, such as the type and kind of the product (optional), quality grade, name of exporter or the packer, net weight, country of origin, date of packing and others.\u003c/p\u003e\n\n\u003cp\u003e\u003cins\u003eThe external cover of food products of plant origin\u003c/ins\u003e in big containers, has to be labelled with at least the following information:\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp; The general name of the product, production or packing date (provided to determine in the documents the production or packing date or validity period) (for non-processed products)\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;The general name of the product, validity period or batch number, provided to determine in the documents the production or packing date or validity period) (for processed food products).\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;For the shipments of food products of plant origin imported in big batches, it is enough to have the product\u0026rsquo;s principal special information in the documents accompanying the shipment.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\n\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/633-قرار-يتعلق-بفرض-وجود-سمة-التعريف-(بطاقة-المعلومات-البيانية)-على-المنتجات-الغذايية-المستوردة-من-اصل-نباتي_20220809112120.pdf\" target=\"_blank\"\u003eTo read the full decision, click on download PDF button below\u003c/a\u003e\u003c/p\u003e\n","descriptionAr":"\u003cp\u003e-\u0026nbsp;\u0026nbsp; \u0026nbsp;يجب ان تحمل عبوات المنتجات الغذائية المستوردة غير الطازجة من اصل نباتي سمة تعريف تعتمد القواعد والإجراءات الوطنية الخاصة، وأن يتم الالتزام بتدوين المعلومات والبيانات اللازمة عليها بشكل واضح غير قابل للمحو على ان تشمل لائحة من المعلومات محددة في متن القرار، منها الاسم العام للمنتج، عنوان المصنع، بلد المنشأ، الحالة الفيزيائية للمنتج، قائمة بكل مكونات المنتج، الوزن والحجم الصافي قبل التعبئة، إشارة مرمزة تتيح معرفة المصنع ودفعة الإنتاج، تاريخ الإنتاج وتاريخ انتهاء الصلاحية وغيرها.\u003c/p\u003e\n\n\u003cp\u003e-\u0026nbsp;\u0026nbsp; \u0026nbsp;يجب ان تحمل عبوات المنتجات الغذائية النباتية الطازجة \u0026nbsp;المستوردة سمة تعريف تعتمد القواعد والإجراءات الوطنية الخاصة، وعلى أن يتم الالتزام بتدوين المعلومات والبيانات اللازمة عليها بشكل واضح غير قابل للمحو على ان تشمل لائحة من المعلومات محددة في متن القرار، منها النوع والصنف بصفة اختيارية، درجة الجودة، اسم المصدر او الموضب، الوزن الصافي، بلد المنشأ، تاريخ التعبئة وغيرها.\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;يجب ان يحمل الغلاف الخارجي للمنتجات الغذائية من أصل نباتي بعبوات كبير على الأقل المعلومات التالية:\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;الاسم العام للمنتج، تاريخ الإنتاج او التعبئة (على ان يحدد في المستندات تاريخ الإنتاج او التعبئة او مدة الصلاحية) (للمنتجات غير المصنعة)\u0026nbsp;\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;الاسم العام للمنتج، مدة الصلاحية او رقم الدفعة على ان يحدد في المستندات تاريخ الإنتاج او التعبئة او مدة الصلاحية (للمنتجات الغذائية المصنعة)\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;اما ارساليات المنتجات الغذائية من اصل نباتي المستوردة بشكل دكمة فيكتفي بوجود المعلومات الأساسية الخاصة بالمنتج المذكورة في المستندات المرفقة بالشحنة.\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/633-قرار-يتعلق-بفرض-وجود-سمة-التعريف-(بطاقة-المعلومات-البيانية)-على-المنتجات-الغذايية-المستوردة-من-اصل-نباتي_20220809112203.pdf\" target=\"_blank\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","keyLegislation":false,"headerId":5,"relatedDecisions":[{"nameEn":"Decision No 1/772: Amendment to Decision 1/633","nameAr":"القرار رقم ١\\٧٧٢ : تعديل القرار ١\\٦٣٣ ","decisionDate":"2014-09-15T00:00:00","headerId":5,"productId":null,"parentDecisionId":462,"filePath":"772-تعديل-قرار-633-سمة-التعريف-على-المنتجات-الغذايية_20220908105511.pdf","keywords":"","descriptionEn":"\u003cp\u003eThis decision has amended article 3 of decision No 1/633 as follows:\u003cbr /\u003e\nThe external cover of food products of plant origin in big containers, has to be labelled with at least the following information:\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp; The general name of the product, production or packing date or batch number (provided to determine in the documents the production or packing date or validity period) (for non-processed products)\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;The general name of the product, validity period or batch number, provided to determine in the documents the production or packing date or validity period) (for processed food products).\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;For the shipments of food products of plant origin imported in big batches, it is enough to have the product\u0026rsquo;s principal special information in the documents accompanying the shipment.\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/772-تعديل-قرار-633-سمة-التعريف-على-المنتجات-الغذايية_20220908105511_20220922154944.pdf\" target=\"_blank\"\u003eTo read the full Law, click on download PDF button below.\u003c/a\u003e\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eعدل هذا القرار المادة الثالثة من القرار رقم ١\\ ٦٣٣ كما يلي.\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;يجب ان يحمل الغلاف الخارجي للمنتجات الغذائية من أصل نباتي بعبوات كبيرة على الأقل المعلومات التالية:\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;الاسم العام للمنتج، تاريخ الإنتاج او التعبئة \u0026nbsp;او رقم الدفعة (على ان يحدد في المستندات تاريخ الإنتاج او التعبئة او مدة الصلاحية) (للمنتجات غير المصنعة)\u0026nbsp;\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;الاسم العام للمنتج، مدة الصلاحية او رقم الدفعة على ان يحدد في المستندات تاريخ الإنتاج او التعبئة او مدة الصلاحية (للمنتجات الغذائية المصنعة)\u003cbr /\u003e\n-\u0026nbsp;\u0026nbsp; \u0026nbsp;اما ارساليات المنتجات الغذائية من اصل نباتي المستوردة بشكل دكمة فيكتفي بوجود المعلومات الأساسية الخاصة بالمنتج المذكورة في المستندات المرفقة بالشحنة.\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/772-تعديل-قرار-633-سمة-التعريف-على-المنتجات-الغذايية_20220908105511_20220922154924.pdf\" target=\"_blank\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","isHidden":false,"keyLegislation":false,"order":5}],"id":462},{"nameEn":"Decision No 1/349: Determining the validity period of lab tests for plant food products and agricultural imports during their location at the customs premises  ","nameAr":"القرار رقم ١\\٣٤٩: تحديد فترة صلاحية التحليل المخبري للمواد الغذائية النباتية والمدخلات الزراعية أثناء وجودها في الحرم الجمركي  ","decisionDate":"2022-08-08T00:00:00","filePath":"decision 349 full_20220912143116.pdf","descriptionEn":"\u003cp\u003eLab tests remain valid to take out imported plant products from customs premises during the determined period and within adequate storage conditions, according to the table determined in the decision.\u0026nbsp;\u003cbr /\u003e\nThe inspection and the lab test should be re-performed on shipments which lab tests have exceeded the duration mentioned in the table, prior to taking them out from customs premises.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\n\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/decision 349 full_20220912141057.pdf\" target=\"_blank\"\u003eTo read the full decision, click on download PDF button below\u003c/a\u003e\u003cbr /\u003e\n\u0026nbsp;\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيبقى التحليل المخبري صالحاً لإخراج المواد النباتية المستوردة من الحرم الجمركي للفترات المحددة وضمن ظروف التخزين الجيدة وفق الجدول المحدد في متن القرار.\u0026nbsp;\u003cbr /\u003e\nيجب إعادة الكشف والتحليل المخبري على الارساليات التي زادت فترة تحليلها الأولى عن المدة التي ذكرت في الجدول قبل السماح بإخراجها من الحرم الجمركي.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003cbr /\u003e\n\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/decision 349 full_20220912141130.pdf\" target=\"_blank\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","keyLegislation":false,"headerId":5,"relatedDecisions":[],"id":521}]},"headers":[{"nameEn":"Product-Specific Regulations","nameAr":"قرارات على مستوى المنتج النهائي","iconUrl":"shopping-cart_20211004004000.svg","order":2,"isHidden":false,"decisions":null,"id":2},{"nameEn":"Processing, Storage and Transportation Regulations","nameAr":"قرارات على مستوى التصنيع، التخزين، التعبئة والنقل","iconUrl":"package_20211004004011.svg","order":3,"isHidden":false,"decisions":null,"id":3},{"nameEn":"Certificates and Attestations Related Regulations","nameAr":"قرارات خاص
