	function removeQuote(strDesc) {
		var tempStr = "";

		}

<script>


function getChapterData() {
	var ctrChapter = document.hsCodeForm.chapterCode.length;
	for (i = 0; i <= ctrChapter; i++) {
		document.hsCodeForm.chapterCode.remove(0);
	}
	var oOption = document.createElement("OPTION");
	oOption.text = "[All]";
	oOption.value = '';
	document.hsCodeForm.chapterCode.add(oOption);
	for (i = 0; i < ChapterCount; i++) {
		if ((Chapter[i].SectionCode == document.hsCodeForm.sectionCode.value)
				|| (document.hsCodeForm.sectionCode.value == 0)) {
			var oOption = document.createElement("OPTION");
			oOption.text = Chapter[i].ChapterDescription;
			oOption.value = Chapter[i].ChapterCode;
			document.hsCodeForm.chapterCode.add(oOption);
		}
	}
	if (document.hsCodeForm.chapterCode.value == "-1") {
		var oOption = document.createElement("OPTION");
		oOption.text = "[None]";
		oOption.value = '';
		document.hsCodeForm.chapterCode.add(oOption);
	} else {
		var ctrHeading = document.hsCodeForm.headingCode.length;
		for (i = 0; i <= ctrHeading; i++) {
			document.hsCodeForm.headingCode.remove(0);
		}
		var oOption = document.createElement("OPTION");
		oOption.text = "[All]";
		oOption.value = '';
		document.hsCodeForm.headingCode.add(oOption);
	}
	document.hsCodeForm.chapterCode.selectedIndex = 0;

}

function getHeadingData() {
	var ctrHeading = document.hsCodeForm.headingCode.length;
	for (i = 0; i <= ctrHeading; i++) {
		document.hsCodeForm.headingCode.remove(0);

	var oOption = document.createElement("OPTION");

	oOption.value = '';
	document.hsCodeForm.headingCode.add(oOption);
	for (i = 0; i < HeadingCount; i++) {

		if ((Heading[i].ChapterCode == document.hsCodeForm.chapterCode.options[document.hsCodeForm.chapterCode.selectedIndex].value)

			oOption.text = Heading[i].HeadingDescription;
			oOption.value = Heading[i].HeadingCode;

	}
}
