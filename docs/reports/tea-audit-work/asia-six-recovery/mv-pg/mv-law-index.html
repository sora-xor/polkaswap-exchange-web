&quot;\u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07b0\u0790\u07b0 \u078a\u07aa\u0791\u07b0 \u0787\u07ac\u0782\u07b0\u0791\u07b0 \u0791\u07b0\u0783\u07a6\u078e\u07b0 \u0787\u07ae\u078c\u07af\u0783\u07a8\u0793\u07a9&quot;,&quot;136&quot;:&quot;\u0780\u07ac\u078d\u07b0\u078c\u07b0 \u0795\u07b0\u0783\u07ae\u0793\u07ac\u0786\u07b0\u079d\u07a6\u0782\u07b0 \u0787\u07ac\u0796\u07ac\u0782\u07b0\u0790\u07a9&quot;,&quot;137&quot;:&quot;\u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07a8\u0787\u07a6\u0782\u07b0 \u0784\u07b0\u078d\u07a6\u0791\u07b0 \u0790\u07a6\u0783\u0788\u07a8\u0790\u07a6\u0790\u07b0&quot;,&quot;138&quot;:&quot;\u0782\u07ad\u079d\u07a6\u0782\u07a6\u078d\u07b0 \u0790\u07af\u079d\u07a6\u078d\u07b0 \u0795\u07b0\u0783\u07ae\u0793\u07ac\u0786\u07b0\u079d\u07a6\u0782\u07b0 \u0787\u07ac\u0796\u07ac\u0782\u07b0\u0790\u07a9&quot;,&quot;139&quot;:&quot;\u0797\u07a6\u0787\u07a8\u078d\u07b0\u0791\u07b0 \u0787\u07ac\u0782\u07b0\u0791\u07b0 \u078a\u07ac\u0789\u07a8\u078d\u07a9 \u0795\u07b0\u0783\u07ae\u0793\u07ac\u0786\u07b0\u079d\u07a6\u0782\u07b0 \u0790\u07a6\u0783\u0788\u07a8\u0790\u07b0&quot;,&quot;140&quot;:&quot;\u0787\u07ac\u0782\u07b0\u0788\u07a6\u0794\u07a6\u0783\u07a6\u0782\u07b0\u0789\u07a6\u0782\u07b0\u0793\u07a6\u078d\u07b0 \u0795\u07b0\u0783\u07ae\u0793\u07ac\u0786\u07b0\u079d\u07a6\u0782\u07b0 \u0787\u07ac\u0796\u07ac\u0782\u07b0\u0790\u07a9&quot;,&quot;141&quot;:&quot;\u0794\u07aa\u0793\u07a8\u078d\u07a8\u0793\u07a9 \u0783\u07ac\u078e\u07a8\u0787\u07aa\u078d\u07ad\u0793\u07a6\u0783\u07a9 \u0787\u07ae\u078c\u07af\u0783\u07a8\u0793\u07a9&quot;,&quot;142&quot;:&quot;\u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07b0\u0790\u07b0 \u0789\u07a9\u0793\u07a8\u0787\u07ae\u0783\u07ae\u078d\u07ae\u0796\u07a8\u0786\u07a6\u078d\u07b0 \u0790\u07a6\u0783\u0788\u07a8\u0790\u07b0&quot;,&quot;143&quot;:&quot;\u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07b0\u0790\u07b0 \u0784\u07a8\u0787\u07aa\u0783\u07af \u0787\u07ae\u078a\u07b0 \u0790\u07b0\u0793\u07ac\u0793\u07a8\u0790\u07b0\u0793\u07a8\u0786\u07b0\u0790\u07b0&quot;,&quot;144&quot;:&quot;\u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07b0\u0790\u07b0 \u078d\u07ad\u0782\u07b0\u0791\u07b0 \u0787\u07ac\u0782\u07b0\u0791\u07b0 \u0790\u07a6\u0783\u0788\u07ad \u0787\u07ae\u078c\u07af\u0783\u07a8\u0793\u07a9&quot;,&quot;145&quot;:&quot;\u078b\u07a8\u0788\u07ac\u0780\u07a8\u0784\u07a6\u0780\u07aa\u078e\u07ac \u0787\u07ac\u0786\u07ac\u0791\u07a6\u0789\u07a9&quot;,&quot;146&quot;:&quot;\u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07b0\u0790\u07b0 \u0786\u07ae\u078d\u07a8\u078a\u07a8\u0786\u07ad\u079d\u07a6\u0782\u07b0\u0790\u07b0 \u0787\u07ae\u078c\u07af\u0783\u07a8\u0793\u07a9&quot;,&quot;147&quot;:&quot;\u078d\u07ad\u0784\u07a6\u0783 \u0783\u07a8\u078d\u07ad\u079d\u07a6\u0782\u07b0\u0790\u07b0 \u0787\u07ae\u078c\u07af\u0783\u07a8\u0793\u07a9&quot;,&quot;148&quot;:&quot;\u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07b0\u0790\u07b0 \u0782\u07ad\u079d\u07a6\u0782\u07a6\u078d\u07b0 \u0790\u07b0\u0786\u07a8\u078d\u07b0\u0790\u07b0 \u0791\u07a8\u0788\u07ac\u078d\u07ae\u0795\u07b0\u0789\u07a6\u0782\u07b0\u0793\u07b0 \u0787\u07ae\u078c\u07af\u0783\u07a8\u0793\u07a9&quot;,&quot;149&quot;:&quot;\u0782\u07ad\u079d\u07a6\u0782\u07a6\u078d\u07b0 \u0784\u07a8\u0787\u07aa\u0783\u07af \u0787\u07ae\u078a\u07b0 \u0786\u07b0\u078d\u07ac\u0790\u07a8\u078a\u07a8\u0786\u07ad\u079d\u07a6\u0782\u07b0&quot;,&quot;150&quot;:&quot;\u07a4\u07a6\u0787\u07aa\u0789\u07a9 \u0786\u07aa\u078c\u07aa\u0784\u07aa\u079a\u07a7\u0782\u07a7&quot;,&quot;151&quot;:&quot;\u07a4\u07a6\u0787\u07aa\u0789\u07a9 \u0787\u07a6\u0783\u07aa\u079d\u07a9\u078a\u07aa&quot;,&quot;152&quot;:&quot;\u0786\u07ae\u0789\u07a8\u0787\u07aa\u0782\u07a8\u0786\u07ad\u079d\u07a6\u0782\u07b0\u0790\u07b0 \u0787\u07ae\u078c\u07af\u0783\u07a8\u0793\u07a9 \u0787\u07ae\u078a\u07b0 \u0789\u07af\u078d\u07b0\u0791\u07a8\u0788\u07b0\u0790\u07b0&quot;,&quot;153&quot;:&quot;\u0796\u07aa\u0791\u07a9\u079d\u07a6\u078d\u07b0 \u0790\u07a6\u0783\u0788\u07a8\u0790\u07b0 \u0786\u07ae\u078
